<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>脱出パズル</title>
    <link rel="stylesheet" href="../common/game-common.css" />
    <style>
      body {
        padding: 0 10px;
        margin: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #222;
        color: #fff;
      }

      .ui-bar {
        width: 100%;
        max-width: 400px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 5px;
        padding-left: 5px;
        padding-right: 5px;
        box-sizing: border-box;
      }

      #stage,
      #score {
        font-size: 20px;
      }

      #gameBoard {
        position: relative;
        width: 100%;
        max-width: 400px;
        aspect-ratio: 1 / 1;
        background: #111;
        box-sizing: border-box;
      }

      #gameCanvas {
        width: 100%;
        max-width: 400px;
        aspect-ratio: 1 / 1;
        background: #111;
        box-sizing: border-box;
        display: block;
        touch-action: none;
      }

      /* 外枠 */
      .board-border {
        position: absolute;
        background: #fff;
        z-index: 2;
        pointer-events: none;
      }

      /* 上 */
      .board-border.top {
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
      }

      /* 左 */
      .board-border.left {
        top: 0;
        left: 0;
        width: 2px;
        height: 100%;
      }

      /* 下 */
      .board-border.bottom {
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
      }

      /*
       * 6×6盤面なので、2行目の高さは全体の1/6。
       * 
       * 出口は2行目なので、
       * 上側は2マス分
       * 下側は3マス分
       */
      .board-border.right-top {
        top: 0;
        right: 0;
        width: 2px;
        height: calc(100% / 3);
      }

      .board-border.right-bottom {
        bottom: 0;
        right: 0;
        width: 2px;
        height: calc(100% / 2);
      }

      #resetStageBtn,
      #startBtn {
        padding: 10px 20px;
        font-size: 18px;
        margin: 15px;
        cursor: pointer;
      }

      #resetStageBtn {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <h1>脱出パズル</h1>
    <div class="ui-bar">
      <div id="stage">Stage: 1</div>
      <div id="score">Score: 0</div>
    </div>
    <div id="gameBoard">
      <canvas id="gameCanvas"></canvas>

      <!-- 外枠 -->
      <div class="board-border top"></div>
      <div class="board-border left"></div>
      <div class="board-border bottom"></div>

      <!-- 右側：出口の上下だけ -->
      <div class="board-border right-top"></div>
      <div class="board-border right-bottom"></div>
    </div>
    <button id="resetStageBtn">ステージリセット</button>
    <button id="startBtn">ゲームスタート</button>

    <script src="../common/game-common.js"></script>
    <script src="game.js"></script>
  </body>
</html>
