<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ブロックプレイスパズル</title>
    <style>
      body {
        padding: 0 10px;
        margin: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #222;
        color: #fff;
      }

      .ui-bar {
        width: 100%;
        max-width: 400px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 5px;
        padding-right: 5px;
        box-sizing: border-box;
      }

      #score {
        font-size: 20px;
      }

      #gameCanvas {
        width: 100%;
        max-width: 400px;
        aspect-ratio: 1 / 1;
        background: #111;
        border: 2px solid #fff;
        box-sizing: border-box;
        display: block;
        touch-action: none;
      }

      #nextBlocksContainer {
        width: 100%;
        max-width: 400px;
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .nextBlockWrapper {
        position: relative;
        flex: 1;
        min-width: 0;
        aspect-ratio: 1 / 1;
      }

      .nextBlockCanvas {
        width: 100%;
        height: 100%;
        background: #111;
        border: 2px solid #fff;
        box-sizing: border-box;
        display: block;
      }

      .rotateBtn {
        position: absolute;
        right: 5px;
        bottom: 5px;

        width: 32px;
        height: 32px;

        padding: 0;
        border: 1px solid #fff;
        border-radius: 50%;

        background: rgba(0, 0, 0, 0.75);
        color: #fff;

        font-size: 22px;
        line-height: 30px;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;
        touch-action: manipulation;
        z-index: 2;
      }

      .rotateBtn:active {
        transform: scale(0.9);
      }

      #startBtn {
        padding: 10px 20px;
        font-size: 18px;
        margin: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>ブロックプレイスパズル</h1>

    <div class="ui-bar">
      <div id="score">Score: 0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="nextBlocksContainer">
      <div class="nextBlockWrapper">
        <canvas class="nextBlockCanvas"></canvas>
        <button class="rotateBtn" aria-label="ブロックを回転">↻</button>
      </div>

      <div class="nextBlockWrapper">
        <canvas class="nextBlockCanvas"></canvas>
        <button class="rotateBtn" aria-label="ブロックを回転">↻</button>
      </div>

      <div class="nextBlockWrapper">
        <canvas class="nextBlockCanvas"></canvas>
        <button class="rotateBtn" aria-label="ブロックを回転">↻</button>
      </div>
    </div>

    <button id="startBtn">ゲームスタート</button>

    <script src="game.js"></script>
  </body>
</html>
