<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>マージタイル</title>
    <style>
      body {
        padding: 0 10px;
        margin: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #222;
        color: #fff;
      }

      .ui-bar {
        width: 100%;
        height: 30px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding-right: 5px;
        box-sizing: border-box;
      }

      #score {
        font-size: 20px;
      }

      #gameWrapper {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
      }

      #gameContainer {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 10px;
        box-sizing: border-box;
      }

      #gameCanvasWrapper {
        flex: 1;
        min-width: 0;
      }

      #gameCanvas {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 2;
        background: #111;
        border: 2px solid #fff;
        box-sizing: border-box;
        display: block;
      }

      #sidebar {
        width: 25%;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .sidebar-spacer {
        height: 30px;
      }

      #nextBlocksCanvas {
        width: 100%;
        height: auto;
        aspect-ratio: 2 / 3;
        background: #111;
        border: 2px solid #fff;
        display: block;
        box-sizing: border-box;
      }

      #startBtn {
        padding: 10px 20px;
        font-size: 18px;
        margin: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>マージタイル</h1>

    <div id="gameWrapper">
      <div id="gameContainer">
        <div id="gameCanvasWrapper">
          <div class="ui-bar">
            <div id="score">Score: 0</div>
          </div>

          <canvas id="gameCanvas"></canvas>
        </div>

        <div id="sidebar">
          <div class="sidebar-spacer"></div>
          <canvas id="nextBlocksCanvas"></canvas>
        </div>
      </div>
    </div>

    <button id="startBtn">ゲームスタート</button>

    <script src="game.js"></script>
  </body>
</html>
