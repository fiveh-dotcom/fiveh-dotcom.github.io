<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>脱出パズル</title>
    <style>
      body {
        padding: 0 10px;
        margin: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #222;
        color: #fff;
      }

      .ui-bar {
        width: 100%;
        max-width: 400px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 5px;
        padding-left: 5px;
        padding-right: 5px;
        box-sizing: border-box;
      }

      #stage,
      #score {
        font-size: 20px;
      }

      #gameCanvas {
        width: 100%;
        max-width: 400px;
        aspect-ratio: 1 / 1;
        background: #111;
        box-sizing: border-box;
        display: block;
        touch-action: none;
      }

      #resetStageBtn,
      #startBtn {
        padding: 10px 20px;
        font-size: 18px;
        margin: 15px;
        cursor: pointer;
      }

      #resetStageBtn {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <h1>脱出パズル</h1>
    <div class="ui-bar">
      <div id="stage">Stage: 1</div>
      <div id="score">Score: 0</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <button id="resetStageBtn">ステージリセット</button>
    <button id="startBtn">ゲームスタート</button>

    <script src="game.js"></script>
  </body>
</html>
