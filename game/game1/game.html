<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>カラータイル</title>
    <link rel="stylesheet" href="../common/game-common.css" />
    <style>
      body {
        padding: 0 10px;
        margin: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #222;
        color: #fff;
      }

      .ui-bar {
        width: 100%;
        max-width: 400px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 5px;
        padding-right: 5px;
        box-sizing: border-box;
      }

      #timeBarContainer {
        width: 200px;
        height: 20px;
        background: #555;
        border: 1px solid #fff;
      }

      #timeBar {
        height: 100%;
        background: #0f0;
        width: 100%;
      }

      #score {
        font-size: 20px;
      }

      #gameCanvas {
        width: 100%;
        max-width: 400px;
        aspect-ratio: 2 / 3;
        background: #111;
        border: 2px solid #fff;
        box-sizing: border-box;
        display: block;
        touch-action: none;
      }

      #startBtn {
        padding: 10px 20px;
        font-size: 18px;
        margin: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>カラータイル</h1>
    <div class="ui-bar">
      <div id="timeBarContainer">
        <div id="timeBar"></div>
      </div>
      <div id="score">Score: 0</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <button id="startBtn">ゲームスタート</button>

    <script src="../common/game-common.js"></script>
    <script src="game.js"></script>
  </body>
</html>
