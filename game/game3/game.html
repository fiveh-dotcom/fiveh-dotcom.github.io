<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ブロック崩し</title>
    <style>
      body {
        padding: 0 10px;
        margin: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #222;
        color: #fff;
      }

      .ui-bar {
        width: 100%;
        max-width: 400px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 5px;
        padding-right: 5px;
        box-sizing: border-box;
      }

      #score {
        font-size: 20px;
      }

      #gameCanvas {
        width: 100%;
        max-width: 400px;
        aspect-ratio: 2 / 3;
        background: #111;
        border: 2px solid #fff;
        box-sizing: border-box;
        display: block;
        touch-action: none;
      }

      #startBtn {
        padding: 10px 20px;
        font-size: 18px;
        margin: 15px;
        cursor: pointer;
      }

      #pauseBtn.small-icon {
        font-size: 13px;
      }

      #pauseOverlay {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        background: rgba(80, 80, 80, 0.7);

        display: none;
        align-items: center;
        justify-content: center;

        z-index: 10000;
      }

      #pauseOverlay.active {
        display: flex;
      }
    </style>
  </head>
  <body>
    <h1>ブロック崩し</h1>
    <div class="ui-bar"><div id="score">Score: 0</div></div>
    <canvas id="gameCanvas"></canvas>
    <button id="startBtn">ゲームスタート</button>
    <button
      id="pauseBtn"
      style="position: fixed; bottom: 10px; right: 10px; z-index: 10001; width: 30px; height: 25px"
      aria-label="一時停止"
    >
      ⏸
    </button>

    <div id="pauseOverlay"></div>

    <script src="game.js"></script>
  </body>
</html>
